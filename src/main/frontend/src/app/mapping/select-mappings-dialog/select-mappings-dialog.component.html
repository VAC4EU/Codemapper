<h1 mat-dialog-title>{{data.title}}</h1>
<div mat-dialog-content>

  @if (data.description) {
  <p>
    {{data.description}}
  </p>
  }

  <mat-checkbox [(ngModel)]="copyComments">Copy review (comments and discussion)</mat-checkbox>

  <div class="filters">
    <mat-form-field>
      <mat-select placeholder="Source folder" [(ngModel)]="selectedFolder"
        (ngModelChange)="changedFolder(selectedFolder!)">
        @for (folderName of folderNames; track folderName) {
        <mat-option [value]="folderName">{{folderName}}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <input matInput [(ngModel)]="searchQuery" (ngModelChange)="applyFilter($event)" placeholder="🔍 Search...">
      <button mat-icon-button matSuffix (click)="searchQuery = ''; applyFilter('')" [disabled]="!searchQuery">
        <mat-icon>backspace</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="$event ? toggleAllRows() : null" [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let element">
        {{element.meta.definition ?? element.mappingName}}
      </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
      <td mat-cell *matCellDef="let element">
        {{element.meta.type}}
      </td>
    </ng-container>

    <ng-container matColumnDef="system">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>System</th>
      <td mat-cell *matCellDef="let element">
        {{element.meta.system}}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</div>
<div mat-dialog-actions>
  <button mat-raised-button [mat-dialog-close]="true">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()">Ok</button>
</div>
